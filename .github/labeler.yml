core:
  - changed-files:
      - any-glob-to-any-file: "packages/core/**/*"

tools:
  - changed-files:
      - any-glob-to-any-file: "packages/tools/**/*"

skills:
  - changed-files:
      - any-glob-to-any-file: "packages/skills/**/*"

protocol:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/a2a/**/*"
          - "packages/mcp-server/**/*"

apps:
  - changed-files:
      - any-glob-to-any-file: "apps/**/*"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"

docker:
  - changed-files:
      - any-glob-to-any-file: "docker/**/*"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pnpm-lock.yaml"
          - "**/package.json"
