name: "Team Dev Assistant CodeQL Config"

query-filters:
  - exclude:
      id: js/http-to-file-access
    # 理由：packages/core/src/playbook/writer.ts 负责将经过 HITL 人工确认的决策数据
    # 沉淀为本地 Markdown 文件。代码内部已经通过 sanitizeNetworkInput 进行了长度限制
    # 和恶意标签过滤，且文件路径通过 path.join 和 basename 严格限制在 docs/playbook 内部。
    # 因此，此处的“网络数据→文件写入”是安全且核心的业务逻辑，属于误报，予以豁免。
