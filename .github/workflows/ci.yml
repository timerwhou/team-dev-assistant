name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------- 变更检测 ----------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'eval/**'
              - 'docker/**'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'

  # ---------- Typecheck ----------
  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail typecheck

  # ---------- Unit Tests ----------
  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm -r --no-bail --if-present test
      - run: pnpm --filter @tda/cli dev -- /help

  # ---------- Eval Gate（只在 code 变更时跑 critical 子集） ----------
  eval-gate:
    name: Eval Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run critical eval subset
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL: ${{ secrets.MODEL }}
          EVAL_SUBSET: critical
        run: pnpm eval

  # ---------- 聚合门禁 ----------
  ci-gate:
    name: CI / Required
    needs: [changes, typecheck, test, eval-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "eval-gate: ${{ needs.eval-gate.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ changes job 失败"
            exit 1
          fi

          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "❌ typecheck 失败"
            exit 1
          fi

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ test 失败"
            exit 1
          fi

          if [ "${{ needs.eval-gate.result }}" == "failure" ]; then
            echo "❌ eval-gate 失败（Agent 能力退化）"
            exit 1
          fi

          echo "✅ 全部通过（或按需跳过）"
