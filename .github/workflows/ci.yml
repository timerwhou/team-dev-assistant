name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------- 变更检测 ----------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'eval/**'
              - 'docker/**'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'

  # ---------- Typecheck ----------
  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail typecheck

  # ---------- Unit Tests ----------
  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm -r --no-bail --if-present test
      - run: pnpm --filter @tda/cli dev -- /help

      - name: Verify Playbook Sync
        run: |
          # 运行同步命令（已具备幂等性）
          pnpm --filter @tda/cli dev "/sync-facts"
          
          # 检查是否产生了未提交的变更
          if [ -n "$(git status --porcelain docs/playbook/)" ]; then
            echo "❌ 发现未同步的 @fact 注释。请运行 /sync-facts 并提交生成的 Playbook 文件。"
            git diff docs/playbook/
            exit 1
          fi
          echo "✅ Playbook 资产与代码中的 @fact 注释完全一致。"

  # ---------- Eval Gate（只在 code 变更时跑 critical 子集） ----------
  eval-gate:
    name: Eval Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run critical eval subset
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL: ${{ secrets.MODEL }}
          EVAL_SUBSET: critical
        run: pnpm eval


  # ---------- Docker Build Check (防破坏) ----------
  docker-build-check:
    name: Docker Build Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: tda-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- MCP Protocol Probe (防协议破裂) ----------
  mcp-probe:
    name: MCP Protocol Probe
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build MCP Server
        run: pnpm --filter @tda/mcp-server build
      - name: Run MCP Probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y @k08200/mcp-probe@latest \
            node packages/mcp-server/dist/index.js \
            --probe-tools \
            --github-summary

  # ---------- 聚合门禁 ----------
  ci-gate:
    name: CI / Required
    needs: [changes, typecheck, test, eval-gate, docker-build-check, mcp-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "eval-gate: ${{ needs.eval-gate.result }}"
          echo "docker-build-check: ${{ needs.docker-build-check.result }}"
          echo "mcp-probe: ${{ needs.mcp-probe.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ changes job 失败"
            exit 1
          fi

          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "❌ typecheck 失败"
            exit 1
          fi

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ test 失败"
            exit 1
          fi

          if [ "${{ needs.eval-gate.result }}" == "failure" ]; then
            echo "❌ eval-gate 失败（Agent 能力退化）"
            exit 1
          fi

          if [ "${{ needs.docker-build-check.result }}" == "failure" ]; then
            echo "❌ docker-build-check 失败（Dockerfile 无法构建）"
            exit 1
          fi

          if [ "${{ needs.mcp-probe.result }}" == "failure" ]; then
            echo "❌ mcp-probe 失败（MCP 协议或工具暴露异常）"
            exit 1
          fi

          echo "✅ 全部通过（或按需跳过）"
