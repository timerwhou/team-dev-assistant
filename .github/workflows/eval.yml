name: Eval

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "运行评估的原因"
        required: false
        default: "手动触发"
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"

jobs:
  eval:
    name: Run Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Create .env
        run: |
          cat > .env <<EOF2
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          MODEL=${{ secrets.MODEL }}
          EOF2

      - name: Run evaluation
        run: pnpm eval

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/report/latest.json
          retention-days: 30
